<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Game to do max Clicks under 60 seconds">
  <meta name="keywords" content="game, Click-Rush, Max Click under 60 sec">
  <meta name="author" content="Ishmeet Singh Sodhi">
  <title>Click-Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="logo">
        <a href="index.html">Click-Rush</a>
      </div>
      <nav>
        <a href="othergames.html" class="nav-button">Chase-Click</a>
        <a href="othergames.html" class="nav-button">Scroll-Runner</a>
        <a href="https://github.com/ISHMEETSINGHSODHI/Click-Rush/blob/c9e336d5fcf18db75f1ddf8dc72bd9ae978e2132/README.md" target="_blank" rel="noopener noreferrer">About</a>
        <a href="https://x.com/IshmeetSingh_1" target="_blank" rel="noopener noreferrer">Contact</a>
        <!-- show when logged OUT -->
        <a href="login.html" rel="noopener noreferrer" id="nav-login">Login</a>
        <a href="register.html" rel="noopener noreferrer" id="nav-register">Register</a>
        <!-- show when logged IN (toggled by updateNav() in utils.js) -->
        <span id="nav-username"></span>
        <a href="profile.html" id="nav-profile" style="display:none;">
          <button type="button">Profile</button>
        </a>
        <button id="nav-logout" style="display:none" onclick="logout()">Logout</button>
      </nav>
    </div>
  </header>
  <main class="main_content">
    <div class="info">
      <h2> Welcome to Click-Rush</h2>
      <h3>Click your mouse fast , as many times as you can in 60 seconds!</h3>
    </div>

    <!-- welcome message shown when logged in (filled by index.js) -->
    <p id="welcome_message" style="display:none;"></p>

    <!-- shown to guests -->
    <div id="login_register">
      <a href="register.html"><button type="button" class="register" id="register_cta">Register</button></a>
      <a href="login.html"><button type="button" class="login" id="login_cta">Log In</button></a>
    </div>
    <div id="skip">
      <a href="game.html"><button type="button">Skip For Now</button></a>
    </div>

    <!-- shown to logged-in users (toggled by index.js) -->
    <div id="play_now" style="display:none;">
      <a href="game.html"><button type="button" class="btn-start">Play Now</button></a>
    </div>
  </main>
  <!-- utils.js FIRST, then index.js -->
  <script src="js/utils.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
