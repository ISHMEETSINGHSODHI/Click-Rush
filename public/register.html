<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
    <div class="container">
      <div class="logo">
        <a href="index.html">Click-Rush</a>
      </div>
      <nav>
        <a href="othergames.html" class="nav-button">Chase-Click</a>
        <a href="othergames.html" class="nav-button">Scroll-Runner</a>
        <a href="https://github.com/ISHMEETSINGHSODHI/Click-Rush/blob/64b39f7c571932d5199fa698945621c392ab669f/About.md" target="_blank" rel="noopener noreferrer">About</a>

      </nav>
    </div>
  </header>

<main class="main_content">
    <h1>Register With Click-Rush</h1>
        <!--id="register_form" matches auth.js -->
    <form  id="register_form" autocomplete="off">

    <div>
     <label for="email">Enter Your Email :</label></br>
     <input
       type="email"
       id="email"
       name="email"
       required
       size="35"
       placeholder="Your e-mail"
       minlength="4"
       maxlength="40"
      />
    </div>
    <div>
     <label for="uname">Username </label>
            <!-- id="uname" matches auth.js -->
     <input
       type="text"
       id="uname"
       name="uname"
       required
       size="35"
       placeholder=" Choose a Username"
       minlength="4"
       maxlength="15"
     />
    </div>
    <div>
        <label for="hexId">Password:</label><br>
        <!-- id="hexId" matches auth.js -->
        <input
          type="password"
          id="hexId"
          name="hexId"
          required
          size="35"
          placeholder="Password (min 4 chars)"
          minlength="4"
          maxlength="40"
          autocomplete="new-password"
        />
    </div>

    <!-- id="register-error" (hyphen) matches auth.js showError()/clearError() calls -->
      <p id="register-error" style="color:red;"></p>
     <div>
     <button type="submit">Register</button>
     <p>* By Clicking on submit you consent for the creation of my Click-Ruch account.</p>
     </div>
     <p>Already have an account? <a href="login.html">Login here</a></p>
     </form>
     </main>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
